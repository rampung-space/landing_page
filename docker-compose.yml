services:
  db:
    image: postgres:17-alpine
    container_name: rampung_test
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${LANDING_DB_NAME:-rampung_test}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${LANDING_DB_NAME:-rampung_test}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
